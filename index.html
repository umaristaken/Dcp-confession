<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCP Confessions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo-circle {
            width: 64px;
            height: 64px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-google {
            width: 100%;
            background-color: #ffffff;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-google:active {
            transform: scale(0.98);
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .hidden {
            display: none !important;
        }

        .status-msg {
            margin-top: 16px;
            font-size: 13px;
            color: #38bdf8;
        }

        textarea {
            width: 100%;
            height: 120px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            padding: 12px;
            font-size: 14px;
            resize: none;
            margin-bottom: 16px;
        }

        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .btn-submit {
            width: 100%;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-logout {
            margin-top: 16px;
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="card">
        <div class="logo-circle">D</div>
        <h1>Welcome to DCP Confessions</h1>
        <p class="subtitle">Sign in with Google to get started. Your identity will remain completely anonymous.</p>
        
        <button id="btn-login" class="btn-google">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </button>

        <p id="status-msg" class="status-msg hidden">Signing in...</p>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="card hidden">
        <div class="logo-circle">D</div>
        <h1>Post a Confession</h1>
        <p class="subtitle">Write your confession below. It will be posted anonymously.</p>

        <textarea id="confession-text" placeholder="Type your confession here..."></textarea>
        <button id="btn-submit" class="btn-submit">Submit Confession</button>

        <button id="btn-logout" class="btn-logout">Sign Out</button>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithRedirect, 
            getRedirectResult, 
            GoogleAuthProvider, 
            onAuthStateChanged,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBIeniPKF4jMcLOK7N4qKVa3SeKUPPjCoI",
            authDomain: "dcp-confession.firebaseapp.com",
            projectId: "dcp-confession",
            storageBucket: "dcp-confession.firebasestorage.app",
            messagingSenderId: "1035061211041",
            appId: "1:1035061211041:web:d56cd711959cc4d75fe5e0",
            measurementId: "G-YBYVLFJ241"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const statusMsg = document.getElementById('status-msg');
        const btnSubmit = document.getElementById('btn-submit');
        const confessionText = document.getElementById('confession-text');

        // Handle Login Redirect Result
        getRedirectResult(auth)
            .then((result) => {
                if (result) {
                    console.log("Successfully logged in:", result.user);
                }
            })
            .catch((error) => {
                console.error("Login Error:", error);
            });

        // Trigger Google Sign-In
        btnLogin.addEventListener('click', () => {
            statusMsg.classList.remove('hidden');
            signInWithRedirect(auth, provider);
        });

        // Track Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
            } else {
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        // Sign Out
        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // Post Confession
        btnSubmit.addEventListener('click', async () => {
            const text = confessionText.value.trim();
            if (!text) {
                alert("Please enter a confession.");
                return;
            }

            try {
                await addDoc(collection(db, "confessions"), {
                    text: text,
                    timestamp: serverTimestamp()
                });
                alert("Confession posted successfully!");
                confessionText.value = "";
            } catch (err) {
                console.error("Error submitting:", err);
                alert("Error posting confession: " + err.message);
            }
        });
    </script>
</body>
            </html>
